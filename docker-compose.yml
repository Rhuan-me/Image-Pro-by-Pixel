services:

  postgres:
    image: postgres:16
    container_name: pixpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixpro
      POSTGRES_USER: pixpro
      POSTGRES_PASSWORD: pixpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixpro -d pixpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: pixpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pixpro-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pixpro
      RABBITMQ_DEFAULT_PASS: pixpro
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: