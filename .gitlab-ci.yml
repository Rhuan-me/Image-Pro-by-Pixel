
stages:
  - build
  - test
  - deploy

default:
  image: node:20-bookworm

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/

build-services:
  stage: build
  timeout: 5 minutes
  script:
    - npm --prefix backend/services/api-gateway ci --cache .npm
    - npm --prefix backend/services/auth-service ci --cache .npm
    - npm --prefix backend/services/image-processing-service ci --cache .npm
    - node --check backend/services/api-gateway/src/app.js
    - node --check backend/services/api-gateway/src/server.js
    - node --check backend/services/api-gateway/src/config/env.js
    - node --check backend/services/api-gateway/src/middlewares/rateLimit.js
    - node --check backend/services/auth-service/src/app.js
    - node --check backend/services/auth-service/src/server.js

test-api-gateway:
  stage: test
  timeout: 5 minutes
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends redis-server
    - redis-server --daemonize yes
    - redis-cli ping
    - npm --prefix backend/services/api-gateway ci --cache .npm
  script:
    - npm --prefix backend/services/api-gateway run coverage
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - backend/services/api-gateway/coverage/
    expire_in: 1 week
  after_script:
    - redis-cli shutdown || true

test-ai-worker:
  stage: test
  timeout: 5 minutes
  script:
    - npm --prefix backend/services/ai-worker ci --cache .npm
    - npm --prefix backend/services/ai-worker run coverage
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - backend/services/ai-worker/coverage/
    expire_in: 1 week

test-auth-service:
  stage: test
  timeout: 5 minutes
  script:
    - npm --prefix backend/services/auth-service ci --cache .npm
    - npm --prefix backend/services/auth-service run coverage
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - backend/services/auth-service/coverage/
    expire_in: 1 week

test-image-processing:
  stage: test
  timeout: 5 minutes
  script:
    - npm --prefix backend/services/image-processing-service ci --cache .npm
    - npm --prefix backend/services/image-processing-service run coverage
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - backend/services/image-processing-service/coverage/
    expire_in: 1 week

build-and-push-images:
  stage: deploy
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/api-gateway:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/api-gateway:latest" backend/services/api-gateway
    - docker push "$CI_REGISTRY_IMAGE/api-gateway:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api-gateway:latest"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/auth-service:latest" backend/services/auth-service
    - docker push "$CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/auth-service:latest"
