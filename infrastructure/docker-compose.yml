services:
  redis:
    image: redis:7-alpine
    container_name: pixpro-redis
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - image_storage:/storage
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixpro-network

  postgres:
    image: postgres:16-alpine
    container_name: pixpro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixpro}
      POSTGRES_USER: ${POSTGRES_USER:-pixpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pixpro-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: pixpro-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pixpro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-rabbit-password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - pixpro-network

  s3-storage:
    image: chrislusf/seaweedfs:latest
    container_name: pixpro-storage
    command: "server -dir=/data -s3"
    ports:
      - "9000:8333"
      - "9333:9333"
    volumes:
      - seaweed_data:/data
    networks:
      - pixpro-network
    restart: unless-stopped

  storage-init:
    image: chrislusf/seaweedfs:latest
    container_name: pixpro-storage-init
    depends_on:
      - s3-storage
    entrypoint: ["sh", "-c", "echo 'Aguardando o Storage subir...'; sleep 3; echo 's3.bucket.create -name pixpro-storage' | weed shell -master='s3-storage:9333'; echo 'Bucket verificado/criado com sucesso!';"]
    networks:
      - pixpro-network
  api-gateway:
    build:
      context: ../backend/services/api-gateway
      dockerfile: Dockerfile
    container_name: pixpro-api-gateway
    env_file:
      - ../backend/services/api-gateway/.env.docker
    environment:
      PORT: 8000
      NODE_ENV: development
      JWT_ENABLED: "true"
      JWT_REVOKED_PREFIX: "pixpro:auth:revoked:"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      PROJECT_SERVICE_URL: "http://project-service:3002"
      IMAGE_SERVICE_URL: "http://image-processing-service:3003"
      JWT_SECRET: "9OIO4sUpcFBu52TfMIg-_aiPci1KOJtmTPQaQDSreV0"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pixpro-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../backend/services/auth-service
      dockerfile: Dockerfile
    container_name: pixpro-auth-service
    env_file:
      - ../backend/services/auth-service/.env.example
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: "postgres://${POSTGRES_USER:-pixpro}:${POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/${POSTGRES_DB:-pixpro}"
      JWT_SECRET: "9OIO4sUpcFBu52TfMIg-_aiPci1KOJtmTPQaQDSreV0"
      JWT_ISSUER: ${JWT_ISSUER:-pixpro-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pixpro-api}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379"
      JWT_REVOKED_PREFIX: "pixpro:auth:revoked:"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pixpro-network
    restart: unless-stopped

  project-service:
    build:
      context: ../backend/services/project-service
      dockerfile: Dockerfile
    container_name: pixpro-project-service
    env_file:
      - ../backend/services/project-service/.env.example
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: "postgres://${POSTGRES_USER:-pixpro}:${POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/${POSTGRES_DB:-pixpro}"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pixpro-network
    restart: unless-stopped

  image-processing-service:
    build:
      context: ../backend/services/image-processing-service
      dockerfile: Dockerfile
    container_name: pixpro-image-processing
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: "postgres://${POSTGRES_USER:-pixpro}:${POSTGRES_PASSWORD:-dev-postgres-password}@postgres:5432/${POSTGRES_DB:-pixpro}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-pixpro}:${RABBITMQ_PASSWORD:-dev-rabbit-password}@rabbitmq:5672"
      STORAGE_BASE_PATH: /storage/raw
      S3_ENDPOINT: "http://s3-storage:8333"
      MINIO_ENDPOINT: "http://s3-storage:8333"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-anykey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-anysecret}
      S3_BUCKET: "pixpro-storage"
      MINIO_BUCKET: "pixpro-storage"
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - image_storage:/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3-storage:
        condition: service_started
    networks:
      - pixpro-network
    restart: unless-stopped

  ai-worker:
    build:
      context: ../backend/services/ai-worker
      dockerfile: Dockerfile
    container_name: pixpro-ai-worker
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-pixpro}:${RABBITMQ_PASSWORD:-dev-rabbit-password}@rabbitmq:5672"
      AI_MODE: simulate
      SIMULATE_DELAY_MS: 8000
      S3_ENDPOINT: "http://s3-storage:8333"
      MINIO_ENDPOINT: "http://s3-storage:8333"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-anykey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-anysecret}
      S3_BUCKET: "pixpro-storage"
      MINIO_BUCKET: "pixpro-storage"
    volumes:
      - image_storage:/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      s3-storage:
        condition: service_started
    networks:
      - pixpro-network
    restart: unless-stopped
  notification-service:
    build:
      context: ../backend/services/notification-service
      dockerfile: Dockerfile
    container_name: pixpro-notification-service
    environment:
      NODE_ENV: development
      PORT: 4000
      LOG_LEVEL: dev
      CORS_ORIGINS: "https://localhost:5173,https://localhost:3000,http://localhost:5173,http://localhost:3000"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      # Apontando para os nomes corretos dos serviços dentro da rede Docker (e não localhost)
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-pixpro}:${RABBITMQ_PASSWORD:-dev-rabbit-password}@rabbitmq:5672"
      RABBITMQ_EXCHANGE: "pixpro.events"
      RABBITMQ_QUEUE: "image-queue"
      RABBITMQ_ROUTING_KEY: "image.uploaded"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379"
      REDIS_KEY_PREFIX: "pixpro:notification:rl:"
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 120
      AUTH_RATE_LIMIT_MAX: 20
      JWT_ENABLED: "true"
      JWT_ALGORITHMS: "HS256"
      JWT_SECRET: "9OIO4sUpcFBu52TfMIg-_aiPci1KOJtmTPQaQDSreV0"
      JWT_ISSUER: "pixpro-auth-service"
      JWT_AUDIENCE: "pixpro-api"
      JWT_REVOKED_PREFIX: "pixpro:auth:revoked:"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ../backend/services/notification-service/certs:/app/certs
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      image-processing-service:
        condition: service_started
    networks:
      - pixpro-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:
  image_storage:
  seaweed_data:

networks:
  pixpro-network:
    name: pixpro-network
    driver: bridge
