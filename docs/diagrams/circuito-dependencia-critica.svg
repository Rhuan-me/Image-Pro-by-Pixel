<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1141px;height:604px;background:#FFFFFF;" width="1141px" height="604px" viewBox="0 0 1141 604" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="9"><text x="15" y="35.421" fill="#000" font-size="22" textLength="1109.496" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">Diagrama C — Padrão Circuit Breaker (Dependência Crítica: Motor de Inferência IA / GPU)</text></g><g class="entity" data-qualified-name="Closed" id="ent0001" data-source-line="13"><rect x="461.226" y="486.209" width="334.824" height="103.813" fill="#D5F5E3" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><line x1="461.226" y1="580.022" x2="796.051" y2="580.022" style="stroke:#000;stroke-width:1;"/><text x="471.226" y="502.348" fill="#000" font-size="12" textLength="182.291" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">CLOSED (Circuito Fechado)</text><text x="471.226" y="516.317" fill="#000" font-size="12" textLength="105.469" font-style="italic" font-family="'Helvetica, Arial, sans-serif'">Operação Normal</text><text x="471.226" y="530.286" fill="#000" font-size="12" textLength="12.99" font-family="'Helvetica, Arial, sans-serif'">---</text><text x="471.226" y="544.254" fill="#000" font-size="12" textLength="314.824" font-family="'Helvetica, Arial, sans-serif'">• Requisições encaminhadas normalmente à IA/GPU</text><text x="471.226" y="558.223" fill="#000" font-size="12" textLength="267.879" font-family="'Helvetica, Arial, sans-serif'">• Monitoramento de taxas de erro e latência</text><text x="471.226" y="572.192" fill="#000" font-size="12" textLength="307.881" font-family="'Helvetica, Arial, sans-serif'">• Métricas resetadas a cada janela de amostragem</text></g><g class="entity" data-qualified-name="Open" id="ent0002" data-source-line="15"><rect x="282.836" y="58.609" width="335.598" height="117.781" fill="#FADBD8" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><line x1="282.836" y1="166.391" x2="618.434" y2="166.391" style="stroke:#000;stroke-width:1;"/><text x="292.836" y="74.748" fill="#000" font-size="12" textLength="155.063" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">OPEN (Circuito Aberto)</text><text x="292.836" y="88.717" fill="#000" font-size="12" textLength="129.205" font-style="italic" font-family="'Helvetica, Arial, sans-serif'">Falha Ativa / Fast-Fail</text><text x="292.836" y="102.686" fill="#000" font-size="12" textLength="12.99" font-family="'Helvetica, Arial, sans-serif'">---</text><text x="292.836" y="116.654" fill="#000" font-size="12" textLength="266.537" font-family="'Helvetica, Arial, sans-serif'">• Bloqueia chamadas ao serviço em colapso</text><text x="292.836" y="130.623" fill="#000" font-size="12" textLength="315.598" font-family="'Helvetica, Arial, sans-serif'">• Resposta imediata com Fallback / Retry com delay</text><text x="292.836" y="144.592" fill="#000" font-size="12" textLength="277.576" font-family="'Helvetica, Arial, sans-serif'">• Inicia timer de recuperação (Cooldown: 30s)</text><text x="292.836" y="158.561" fill="#000" font-size="12" textLength="244.629" font-family="'Helvetica, Arial, sans-serif'">• Protege a GPU contra sobrecarga/OOM</text></g><g class="entity" data-qualified-name="HalfOpen" id="ent0003" data-source-line="17"><rect x="194.396" y="279.399" width="364.479" height="103.813" fill="#FCF3CF" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><line x1="194.396" y1="373.212" x2="558.875" y2="373.212" style="stroke:#000;stroke-width:1;"/><text x="204.396" y="295.538" fill="#000" font-size="12" textLength="176.086" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">HALF_OPEN (Meio Aberto)</text><text x="204.396" y="309.507" fill="#000" font-size="12" textLength="167.795" font-style="italic" font-family="'Helvetica, Arial, sans-serif'">Verificação de Recuperação</text><text x="204.396" y="323.476" fill="#000" font-size="12" textLength="12.99" font-family="'Helvetica, Arial, sans-serif'">---</text><text x="204.396" y="337.444" fill="#000" font-size="12" textLength="344.479" font-family="'Helvetica, Arial, sans-serif'">• Permite passagem de requisições-sonda (Canary: N=3)</text><text x="204.396" y="351.413" fill="#000" font-size="12" textLength="224.584" font-family="'Helvetica, Arial, sans-serif'">• Avalia estabilidade do serviço de IA</text><text x="204.396" y="365.382" fill="#000" font-size="12" textLength="284.982" font-family="'Helvetica, Arial, sans-serif'">• Bloqueia o tráfego restante temporariamente</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="11"><ellipse cx="969.636" cy="331.299" rx="10" ry="10" fill="#FFF" style="stroke:#000;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="28"><path d="M653.826,81.579 L653.826,113.499 L618.886,117.499 L653.826,121.499 L653.826,153.423 A4,4 0 0 0 657.826,157.423 L1007.447,157.423 A4,4 0 0 0 1011.447,153.423 L1011.447,87.579 L1001.447,77.579 L657.826,77.579 A4,4 0 0 0 653.826,81.579" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M1001.447,77.579 L1001.447,85.579 A2,2 0 0 0 1003.447,87.579 L1011.447,87.579 L1001.447,77.579" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="659.826" y="93.718" fill="#000" font-size="12" textLength="278.707" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">Comportamento durante Circuito Aberto:</text><text x="659.826" y="107.687" fill="#000" font-size="12" textLength="331.33" font-family="'Helvetica, Arial, sans-serif'">1. Chamadas não alcançam a GPU/API de IA com falha.</text><text x="659.826" y="121.656" fill="#000" font-size="12" textLength="265.91" font-family="'Helvetica, Arial, sans-serif'">2. Mensagem é desviada para a fila de retry</text><text x="671.27" y="135.624" fill="#000" font-size="12" font-family="'Helvetica, Arial, sans-serif'">(</text><text x="675.951" y="135.624" fill="#000" font-size="12" textLength="120.855" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">image.retry.delay</text><text x="796.807" y="135.624" fill="#000" font-size="12" textLength="199.641" font-family="'Helvetica, Arial, sans-serif'">) ou retorna resposta degradada.</text><text x="659.826" y="149.593" fill="#000" font-size="12" textLength="289.471" font-family="'Helvetica, Arial, sans-serif'">3. Previne efeito cascata e colapso de memória.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="36"><path d="M182.716,509.179 L182.716,567.054 A4,4 0 0 0 186.716,571.054 L422.56,571.054 A4,4 0 0 0 426.56,567.054 L426.56,542.109 L461.076,538.109 L426.56,534.109 L426.56,515.179 L416.56,505.179 L186.716,505.179 A4,4 0 0 0 182.716,509.179" style="stroke:#000;stroke-width:1;" fill="#FFF"/><path d="M416.56,505.179 L416.56,513.179 A2,2 0 0 0 418.56,515.179 L426.56,515.179 L416.56,505.179" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="188.716" y="521.318" fill="#000" font-size="12" textLength="151.846" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">Métricas Monitoradas:</text><text x="188.716" y="535.287" fill="#000" font-size="12" textLength="183.316" font-family="'Helvetica, Arial, sans-serif'">• Timeout (> 10s de resposta)</text><text x="188.716" y="549.256" fill="#000" font-size="12" textLength="182.156" font-family="'Helvetica, Arial, sans-serif'">• Erros HTTP 500/503 ou OOM</text><text x="188.716" y="563.224" fill="#000" font-size="12" textLength="222.844" font-family="'Helvetica, Arial, sans-serif'">• Taxa de transferência (throughput)</text></g><!--link *start* to Closed--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="11" data-link-type="dependency"><path d="M965.346,340.459 C959.276,351.349 947.276,370.739 932.636,383.209 C882.756,425.689 823.699,458.152 767.559,483.652" style="stroke:#2C3E50;stroke-width:1.5;" fill="none" id="*start*-to-Closed"/><polygon points="763.006,485.719,772.855,485.639,767.559,483.652,769.546,478.355,763.006,485.719" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="889.416" y="439.348" fill="#000" font-size="12" textLength="140.273" font-family="'Helvetica, Arial, sans-serif'">Inicialização do Serviço</text></g><!--link Closed to Open--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="19" data-link-type="dependency"><path d="M635.226,485.939 C641.446,416.899 642.956,292.649 588.636,206.399 C581.746,195.459 576.687,188.958 566.867,180.198" style="stroke:#2C3E50;stroke-width:1.5;" fill="none" id="Closed-to-Open"/><polygon points="563.136,176.869,567.19,185.845,566.867,180.198,572.515,179.876,563.136,176.869" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="718.585" y="321.938" fill="#000" font-size="12" textLength="134.01" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">Gatilho de Abertura</text><text x="638.106" y="335.907" fill="#000" font-size="12" textLength="294.967" font-family="'Helvetica, Arial, sans-serif'">Taxa de falha > 50% ou 5 timeouts consecutivos</text><text x="712.931" y="349.876" fill="#000" font-size="12" textLength="145.318" font-family="'Helvetica, Arial, sans-serif'">(Janela de 10 segundos)</text></g><!--link Open to HalfOpen--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="21" data-link-type="dependency"><path d="M282.536,146.669 C218.296,161.159 155.796,181.139 136.636,206.399 C106.806,245.719 137.389,271.909 189.269,291.169" style="stroke:#2C3E50;stroke-width:1.5;" fill="none" id="Open-to-HalfOpen"/><polygon points="193.956,292.909,186.911,286.027,189.269,291.169,184.127,293.527,193.956,292.909" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="216.673" y="218.538" fill="#000" font-size="12" textLength="111.123" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">Gatilho de Teste</text><text x="137.636" y="232.507" fill="#000" font-size="12" textLength="269.197" font-family="'Helvetica, Arial, sans-serif'">Tempo de Cooldown expirado (30 segundos)</text><text x="195.486" y="246.476" fill="#000" font-size="12" textLength="153.498" font-family="'Helvetica, Arial, sans-serif'">(Preparação para probes)</text></g><!--link HalfOpen to Open--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" id="lnk9" data-source-line="25" data-link-type="dependency"><path d="M399.786,279.309 C403.946,269.469 408.076,259.169 411.636,249.399 C420.186,225.889 426.931,204.333 433.531,181.453" style="stroke:#2C3E50;stroke-width:1.5;" fill="none" id="HalfOpen-to-Open"/><polygon points="434.916,176.649,428.579,184.188,433.531,181.453,436.265,186.405,434.916,176.649" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="428.573" y="218.538" fill="#000" font-size="12" textLength="150.199" font-weight="700" font-family="'Helvetica, Arial, sans-serif'">Gatilho de Reabertura</text><text x="426.926" y="232.507" fill="#000" font-size="12" textLength="153.492" font-family="'Helvetica, Arial, sans-serif'">Qualquer falha detectada</text><text x="430.615" y="246.476" fill="#000" font-size="12" textLength="146.115" font-family="'Helvetica, Arial, sans-serif'">nas requisições de teste</text></g><!--link HalfOpen to Closed--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk8" data-source-line="23" data-link-type="dependency"><path d="M366.596,383.569 C364.746,407.849 367.176,435.899 382.636,456.209 C388.796,464.299 416.588,475.243 456.098,488.003" style="stroke:#2C3E50;stroke-width:1.5;" fill="none" id="HalfOpen-to-Closed"/><polygon point